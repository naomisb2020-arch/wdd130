<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - White Water Rafting</title>
    <meta name="description"
      content="Get in touch with White Water Rafting. Find our address, phone number, location map, or send us a message using our contact form.">
    <meta name="author" content="Naomi Fabiola Serrano Bravo">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.webp" alt="Rafting Company Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="company-info">
            <h1>White Water Rafting Company</h1>
            <address>
                123 Main River Street<br>
                Kolob, California<br>
                +1 999 999 9999<br>
                <a href="mailto:info@whitewater.com">info@whitewater.com</a>
            </address>
        </section>

        <div class="map-form-container">
            <div class="map-box">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3151.83543450937!2d-122.4194155!3d37.7749295!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMzd0NDYnMjkuNyJOIDEyMsKwMjUnMDkuOSJX!5e0!3m2!1sen!2sus!4v1610000000000!5m2!1sen!2sus"
                  width="600" height="400" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <form class="contact-form" action="#" method="post">
                <div class="form-group row-align">
                    <label for="fullname">Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Placeholder"
                      required>
                </div>

                <div class="form-group row-align">
                    <label for="useremail">Email</label>
                    <input type="email" id="useremail" name="useremail" placeholder="Placeholder"
                      required>
                </div>

                <div class="form-group row-align radio-group">
                    <span class="radio-title">Message Purpose</span>
                    <div class="radio-options">
                        <label><input type="radio" id="general" name="purpose" value="general"
                              checked> General
                            Inquiry</label>
                        <label><input type="radio" id="reservation" name="purpose"
                              value="reservation"> Reservation
                            Question</label>
                        <label><input type="radio" id="suggestion" name="purpose"
                              value="suggestion"> Website
                            Suggestion</label>
                    </div>
                </div>

                <div class="form-group column-align">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type here" rows="4"
                      required></textarea>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit" class="submit-btn">Get in Touch!</button>
            </form>
        </div>


        <section class="employees-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-profiles">
                <figure>
                    <img src="images/employee1.jpg" alt="Profile of John Doe">
                    <figcaption>John Doe - CEO & Lead Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Profile of Jane Smith">
                    <figcaption>Jane Smith - Operations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Profile of Alex River">
                    <figcaption>Alex River - Safety Instructor</figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <p>© 2026 White Water Rafting Co. | Naomi Fabiola Serrano Bravo</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.webp" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.webp" alt="LinkedIn Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.webp" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
