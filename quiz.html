<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML and CSS Quiz - WDD 130</title>
    <meta name="description"
      content="An online quiz form testing HTML and CSS knowledge for WDD 130.">
    <meta name="author" content="Naomi Fabiola Serrano Bravo">
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <header>
        <h1>HTML and CSS Quiz</h1>
    </header>

    <main>
        <form action="#" method="get">

            <!-- First question: Fill in the blank -->
            <div class="form-item">
                <label for="q1">1. What HTML element is used to specify a footer for a document or
                    section?</label>
                <input type="text" id="q1" name="q1">
            </div>

            <!-- Second question: Short answer -->
            <div class="form-item">
                <label for="q2">2. Explain in your own words what CSS Flexbox is used for:</label>
                <textarea id="q2" name="q2" rows="4"></textarea>
            </div>

            <!-- Third question: Dropdown) -->
            <div class="form-item">
                <label for="q3">3. Which CSS property is used to change the text color of an
                    element?</label>
                <select id="q3" name="q3">
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="font-color">font-color</option>
                    <option value="color">color</option>
                    <option value="text-color">text-color</option>
                </select>
            </div>

            <!-- Fourth question: Integer answer -->
            <div class="form-item">
                <label for="q4">4. How many heading levels are available in HTML (from h1 to h...)?
                    Enter the number:</label>
                <input type="number" id="q4" name="q4">
            </div>

            <!-- Send button -->
            <button type="submit">Submit Quiz</button>

        </form>
    </main>

    <footer>
        <p>© 2026 | HTML and CSS Quiz Activity</p>
    </footer>
</body>

</html>
